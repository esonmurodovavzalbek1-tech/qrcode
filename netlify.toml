[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/*"
[headers.values]
Cache-Control = "public, max-age=3600"
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"
X-XSS-Protection = "1; mode=block"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "geolocation=(), microphone=(), camera=()"
Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://cdnjs.cloudflare.com 'unsafe-inline'; font-src 'self' https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
for = "/qrcode.js"
[headers.values]
Cache-Control = "public, max-age=86400"
Content-Type = "application/javascript"

[[headers]]
for = "/style.css"
[headers.values]
Cache-Control = "public, max-age=86400"
Content-Type = "text/css"

[[headers]]
for = "/sw.js"
[headers.values]
Cache-Control = "public, max-age=3600"
Service-Worker-Allowed = "/"
